x-chatwoot: &chatwoot
  image: ${CHATWOOT_IMAGE:-omnicem/chatwoot:reports}
  volumes:
    - /mnt/docker/volumes/chatwoot_storage:/app/storage

x-chatwoot-environment: &chatwoot-environment
  RAILS_ENV: production
  NODE_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SERVE_STATIC_FILES: "true"
  INSTALLATION_ENV: docker
  POSTGRES_HOST: chatwoot_postgres
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DATABASE: chatwoot_production
  REDIS_URL: redis://chatwoot_redis:6379
  FRONTEND_URL: https://${OMNICEM_URL}.aigentss.cloud
  CHATWOOT_HUB_URL: https://${OMNICEM_URL}.aigentss.cloud/app/#
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  AGENT_BOT_PRIVATE_WEBHOOK_HOSTS: ${AGENT_BOT_PRIVATE_WEBHOOK_HOSTS:-}

services:
  chatwoot_postgres:
    image: ankane/pgvector:latest
    container_name: chatwoot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatwoot_production
    volumes:
      - /mnt/docker/volumes/chatwoot_postgres/data:/var/lib/postgresql/data
    expose:
      - "5432"

  chatwoot_redis:
    image: redis:7
    container_name: chatwoot_redis
    restart: unless-stopped
    volumes:
      - /mnt/docker/volumes/chatwoot_redis/data:/data
    expose:
      - "6379"

  chatwoot:
    <<: *chatwoot
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
        RAILS_SERVE_STATIC_FILES: "true"
    container_name: chatwoot
    restart: unless-stopped
    depends_on:
      - chatwoot_postgres
      - chatwoot_redis
    environment:
      <<: *chatwoot-environment
      URL_REPORT: ${URL_REPORT}
      URL_REPORT_ALLOW_PRIVATE_NETWORK: ${URL_REPORT_ALLOW_PRIVATE_NETWORK:-false}
    command: ["bundle", "exec", "rails", "s", "-b", "0.0.0.0", "-p", "3000"]
    expose:
      - "3000"

  chatwoot_sidekiq:
    <<: *chatwoot
    container_name: chatwoot_sidekiq
    restart: unless-stopped
    depends_on:
      - chatwoot_postgres
      - chatwoot_redis
    environment: *chatwoot-environment
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

networks:
  default:
    external: true
    name: proxy_network
